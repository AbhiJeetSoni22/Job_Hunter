[mypy]
python_version = 3.12
strict = true
ignore_missing_imports = true

[mypy-tests.*]
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[mypy-fitz.*]
ignore_missing_imports = true

[mypy-google.*]
ignore_missing_imports = true

[mypy-google.generativeai.*]
ignore_missing_imports = true

[mypy-playwright.*]
ignore_missing_imports = true
