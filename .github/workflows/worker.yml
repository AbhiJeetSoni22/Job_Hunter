name: Background Task Worker

'on':
  repository_dispatch:
    types: [process_task_queue]
  workflow_dispatch:
  schedule:
    # Conservative fallback schedule: every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    # Recovers missed dispatches or delayed exponential backoff retries.
    # Note: GitHub Actions schedule triggers can be delayed during peak times.
    - cron: '0 */6 * * *'

concurrency:
  group: worker-task-queue
  cancel-in-progress: false

jobs:
  worker:
    name: Background Task Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend"

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install Playwright Chromium and system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Background Task Worker (Drain Mode)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          APP_ENV: ${{ vars.APP_ENV || 'production' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://job-hunter-blond-one.vercel.app' }}
        run: |
          python -m app.worker.main --drain --max-duration-seconds 540
